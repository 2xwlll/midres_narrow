[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "midres-search"
version = "0.1.0"
description = "Tutorials and experiments for mid-resolution narrowband searches"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "h5py", "hdf5plugin"]

[project.optional-dependencies]
search = ["pandas", "turbo-seti", "matplotlib"]
injections = ["setigen", "astropy", "matplotlib"]

[project.scripts]
midres-boundaries = "midres_search.boundaries:main"

[tool.setuptools.packages.find]
where = ["src"]
